plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'io.github.cctyl.nokia.keycore'
    compileSdk rootProject.ext.COMPILE_SDK

    defaultConfig {
        minSdk rootProject.ext.MIN_SDK
        targetSdk rootProject.ext.TARGET_SDK
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // NewApi 必须开启：minSdk=19（Android 4.4）下，高于 minSdk 的 API 调用只会在旧设备上
        // 「运行时」抛 NoSuchMethodError / NoClassDefFoundError，编译器按 compileSdk 编译永远
        // 发现不了，Lint 的 NewApi 规则是唯一静态防线。本模块是各 App 共用的 SDK，问题会扩散。
        // ⚠ 禁止 disable 'NewApi'，也禁止用 `-x lint` 跳过 Lint；确属误报时在调用点逐处用
        //   @RequiresApi / @TargetApi / @SuppressLint("NewApi") 豁免并写明理由。
        // 改完涉及 API 调用的代码后请显式执行：gradlew.bat :keydroidx-key-core:lintDebug
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'io.github.cctyl.nokia'
                artifactId = 'keydroidx-key-core'
                version = '1.0.0'
            }
        }
    }
}

dependencies {
    api project(':keydroidx-common')
    api 'androidx.appcompat:appcompat:1.6.1'
}
