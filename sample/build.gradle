plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'io.github.cctyl.nokia.sample'
    compileSdk rootProject.ext.COMPILE_SDK

    defaultConfig {
        applicationId "io.github.cctyl.nokia.sample"
        minSdk rootProject.ext.MIN_SDK
        targetSdk rootProject.ext.TARGET_SDK
        versionCode 1
        versionName "1.0"

        // 反馈服务配置：由接入方提供，密钥绝不入库（见 .gitignore）
        buildConfigField "String", "FEEDBACK_UPLOAD_URL", '"' + (localProps.getProperty('FEEDBACK_UPLOAD_URL') ?: 'http://127.0.0.1:9421/upload') + '"'
        buildConfigField "String", "FEEDBACK_SECRET_KEY", '"' + (localProps.getProperty('FEEDBACK_SECRET_KEY') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(project.hasProperty("RELEASE_STORE_FILE") ? RELEASE_STORE_FILE : "test.jks")
            storePassword project.hasProperty("RELEASE_STORE_PASSWORD") ? RELEASE_STORE_PASSWORD : ""
            keyAlias project.hasProperty("RELEASE_KEY_ALIAS") ? RELEASE_KEY_ALIAS : "key0"
            keyPassword project.hasProperty("RELEASE_KEY_PASSWORD") ? RELEASE_KEY_PASSWORD : ""
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':nokia-key-core')
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
