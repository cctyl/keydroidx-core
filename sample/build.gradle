plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'io.github.cctyl.nokia.sample'
    compileSdk rootProject.ext.COMPILE_SDK

    defaultConfig {
        applicationId "io.github.cctyl.nokia.sample"
        minSdk rootProject.ext.MIN_SDK
        targetSdk rootProject.ext.TARGET_SDK
        versionCode 1
        versionName "1.1"

        // 反馈服务配置：由接入方提供，密钥绝不入库（见 .gitignore）
        // 仅一个根地址 FEEDBACK_URL，SDK 内部自动拼接 /upload、/install 路径
        buildConfigField "String", "FEEDBACK_URL", '"' + (localProps.getProperty('FEEDBACK_URL') ?: 'http://127.0.0.1') + '"'
        buildConfigField "String", "FEEDBACK_SECRET_KEY", '"' + (localProps.getProperty('FEEDBACK_SECRET_KEY') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(keystoreProps.getProperty("RELEASE_STORE_FILE") ?: (project.hasProperty("RELEASE_STORE_FILE") ? RELEASE_STORE_FILE : "test.jks"))
            storePassword keystoreProps.getProperty("RELEASE_STORE_PASSWORD") ?: (project.hasProperty("RELEASE_STORE_PASSWORD") ? RELEASE_STORE_PASSWORD : "")
            keyAlias keystoreProps.getProperty("RELEASE_KEY_ALIAS") ?: (project.hasProperty("RELEASE_KEY_ALIAS") ? RELEASE_KEY_ALIAS : "key0")
            keyPassword keystoreProps.getProperty("RELEASE_KEY_PASSWORD") ?: (project.hasProperty("RELEASE_KEY_PASSWORD") ? RELEASE_KEY_PASSWORD : "")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // NewApi 必须开启：minSdk=19（Android 4.4）下，高于 minSdk 的 API 调用只会在旧设备上
        // 「运行时」抛 NoSuchMethodError / NoClassDefFoundError，编译器按 compileSdk 编译永远
        // 发现不了，Lint 的 NewApi 规则是唯一静态防线（本模块是接入示例，勿给接入方做坏示范）。
        // ⚠ 禁止 disable 'NewApi'，也禁止用 `-x lint` 跳过 Lint；确属误报时在调用点逐处用
        //   @RequiresApi / @TargetApi / @SuppressLint("NewApi") 豁免并写明理由。
        // 改完涉及 API 调用的代码后请显式执行：gradlew.bat :sample:lintDebug
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':keydroidx-key-core')
    implementation project(':keydroidx-mini-shizuku')
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
